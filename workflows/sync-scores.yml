# .github/workflows/sync-scores.yml
#
# Scrapes htosports on GitHub's IP (not blocked), parses scores,
# and writes them directly to JSONBin. The app picks them up on next load.
#
# Schedule:
#   - Every hour during the season (Mon–Sat)
#   - Every 15 min on Thursdays 6–9 PM ET (game night)
#
# GitHub Actions cron is UTC. Eastern = UTC-4 (EDT summer).
# Thursday 6 PM ET  = Thursday 22:00 UTC
# Thursday 9 PM ET  = Friday   01:00 UTC

name: Sync HTO Scores

on:
  schedule:
    # Every hour Mon–Sat (covers full season, skips Sunday)
    - cron: '0 * * * 1-6'
    # Game night — every 15 min Thursday 10 PM UTC to Friday 2 AM UTC (6 PM–10 PM ET)
    - cron: '0,15,30,45 22 * * 4'
    - cron: '0,15,30,45 23 * * 4'
    - cron: '0,15,30,45 0  * * 5'
    - cron: '0,15,30,45 1  * * 5'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch cheerio
        working-directory: scripts

      - name: Run score sync
        env:
          JSONBIN_BIN_ID:    ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_WRITE_KEY: ${{ secrets.JSONBIN_WRITE_KEY }}
        run: node sync-scores.js
        working-directory: scripts
